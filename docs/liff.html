<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="robots" content="noindex"/>
  <!-- LIFF app ID (LINE Developers Console → LINE Login channel → LIFF). Empty = plain web page, text-only LINE share. -->
  <meta name="waiair-liff-id" content="2011588894-6mIqKfeC"/>
  <title>WaiAir</title>
  <meta name="theme-color" content="#0B1F3A"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Jost:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --navy: #0B1F3A;
      --navy-deep: #071526;
      --gold: #A8905A;
      --gold-soft: rgba(168, 144, 90, 0.18);
      --cream: #FAF8F4;
      --cream-dim: rgba(250, 248, 244, 0.72);
      --cream-mute: rgba(250, 248, 244, 0.48);
      --line: rgba(168, 144, 90, 0.28);
      --card: rgba(18, 40, 69, 0.72);
      --warn: #E8C27A;
      --bad: #F28B82;
      --done: #8FD19E;
      --line-green: #06C755;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    body {
      min-height: 100vh;
      font-family: "Jost", "Noto Sans Thai", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--cream);
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(168,144,90,0.16), transparent 55%),
        linear-gradient(165deg, var(--navy) 0%, var(--navy-deep) 100%);
      background-attachment: fixed;
      line-height: 1.5;
      padding: max(1rem, env(safe-area-inset-top)) 1rem max(2rem, env(safe-area-inset-bottom));
    }
    button, input { font: inherit; color: inherit; }
    .wrap { width: min(460px, 100%); margin: 0 auto; }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .brand {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.7rem; font-weight: 600; letter-spacing: 0.02em;
      color: var(--cream); text-decoration: none;
    }
    .brand span { color: var(--gold); }
    .chips { display: flex; gap: 0.35rem; }
    .chip {
      border: 1px solid var(--line); background: transparent; border-radius: 999px;
      padding: 0.2rem 0.7rem; font-size: 0.8rem; color: var(--cream-dim); cursor: pointer;
    }
    .chip[aria-pressed="true"], .chip[aria-selected="true"] { background: var(--gold-soft); color: var(--cream); border-color: var(--gold); }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem; margin-bottom: 0.9rem; }
    .tabs .chip { padding: 0.55rem; font-size: 0.95rem; font-weight: 500; }
    .search { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
    .search input {
      flex: 1; min-width: 0; padding: 0.8rem 0.9rem; border-radius: 12px;
      border: 1px solid var(--line); background: var(--card);
      font-size: 1rem; letter-spacing: 0.04em; text-transform: uppercase; outline: none;
    }
    .search input::placeholder { text-transform: none; letter-spacing: 0; color: var(--cream-mute); }
    .search input:focus { border-color: var(--gold); }
    .search button {
      padding: 0 1.1rem; border: 0; border-radius: 12px; cursor: pointer;
      background: var(--gold); color: var(--navy); font-weight: 600;
    }
    .msg { color: var(--cream-dim); font-size: 0.92rem; margin: 0.25rem 0 0.75rem; }
    .msg.error { color: var(--warn); }
    .panel {
      background: var(--card); border: 1px solid var(--line); border-radius: 18px;
      padding: 1.2rem 1.15rem 1.3rem; backdrop-filter: blur(10px);
    }
    .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.75rem; }
    .label { font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); font-weight: 500; }
    .flight { font-family: "Cormorant Garamond", Georgia, serif; font-size: 2.3rem; font-weight: 600; letter-spacing: 0.04em; line-height: 1.1; }
    .pill {
      display: inline-flex; align-items: center; gap: 0.4rem; white-space: nowrap;
      padding: 0.3rem 0.7rem; border-radius: 999px; border: 1px solid var(--line);
      background: var(--gold-soft); font-size: 0.82rem; font-weight: 500; margin-top: 0.3rem;
    }
    .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .tone-ok { color: var(--cream); }
    .tone-warn { color: var(--warn); }
    .tone-bad { color: var(--bad); }
    .tone-done { color: var(--done); }
    .route {
      display: grid; grid-template-columns: 1fr auto 1fr; gap: 0.75rem; align-items: center;
      margin: 1.2rem 0 1rem; padding: 0.9rem 0;
      border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    }
    .city { font-size: 0.78rem; color: var(--cream-mute); min-height: 1.1em; }
    .iata { font-size: 1.55rem; font-weight: 600; letter-spacing: 0.06em; }
    .time { font-size: 1rem; font-weight: 500; }
    .right { text-align: right; }
    .arrow { color: var(--gold); font-size: 1.1rem; }
    .meta { display: grid; gap: 0.6rem; }
    .row { display: flex; justify-content: space-between; gap: 1rem; align-items: baseline; }
    .k { color: var(--cream-mute); font-size: 0.84rem; }
    .v { font-size: 0.98rem; font-weight: 500; text-align: right; }
    .updated { margin-top: 0.9rem; font-size: 0.8rem; color: var(--cream-mute); }
    .share {
      display: block; width: 100%; margin-top: 1rem; padding: 0.9rem 1rem; border: 0; border-radius: 12px;
      background: var(--line-green); color: #fff; font-weight: 600; font-size: 0.98rem; cursor: pointer;
    }
    .share:active, .search button:active { transform: scale(0.98); }
    .seg { display: flex; gap: 0.4rem; margin-bottom: 0.75rem; }
    .board-title { font-size: 0.9rem; color: var(--cream-dim); margin-bottom: 0.5rem; }
    .board { list-style: none; display: grid; gap: 0.45rem; }
    .board-row {
      width: 100%; display: grid; grid-template-columns: 3.4rem 1fr auto; gap: 0.7rem; align-items: center;
      text-align: left; padding: 0.7rem 0.8rem; border-radius: 12px; cursor: pointer;
      border: 1px solid var(--line); background: var(--card);
    }
    .board-row .t { font-weight: 600; font-variant-numeric: tabular-nums; }
    .board-row .t small { display: block; font-size: 0.72rem; font-weight: 500; color: var(--warn); }
    .board-row .n { display: block; font-weight: 600; letter-spacing: 0.03em; }
    .board-row .d { display: block; font-size: 0.8rem; color: var(--cream-mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .board-row .mid { display: block; min-width: 0; }
    .board-row .s { font-size: 0.8rem; font-weight: 500; text-align: right; }
    .board-row .s small { display: block; color: var(--cream-mute); font-weight: 400; }
    .getapp {
      display: block; margin-top: 1.5rem; text-align: center; font-size: 0.85rem;
      color: var(--gold); text-decoration: none;
    }
    .toast {
      position: fixed; left: 50%; bottom: max(1.5rem, env(safe-area-inset-bottom)); transform: translateX(-50%);
      background: var(--cream); color: var(--navy); padding: 0.55rem 1rem; border-radius: 999px;
      font-size: 0.9rem; font-weight: 500; box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <a class="brand" href="https://waiair.app" target="_blank" rel="noopener">Wai<span>Air</span></a>
      <div class="chips" role="group" aria-label="Language">
        <button type="button" class="chip" data-lang="th">ไทย</button>
        <button type="button" class="chip" data-lang="en">EN</button>
      </div>
    </header>

    <div class="tabs" role="tablist">
      <button type="button" class="chip" role="tab" data-tab="flight" data-i18n="tabFlight"></button>
      <button type="button" class="chip" role="tab" data-tab="airport" data-i18n="tabAirport"></button>
    </div>

    <section id="flightView">
      <form class="search" id="flightForm" autocomplete="off">
        <input id="flightInput" name="flight" maxlength="10" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="search" data-i18n-placeholder="flightPlaceholder"/>
        <button type="submit" data-i18n="search"></button>
      </form>
      <p class="msg" id="flightMsg" hidden></p>
      <article class="panel" id="flightCard" hidden>
        <div class="card-head">
          <div>
            <div class="label" id="fcAirline"></div>
            <div class="flight" id="fcNumber"></div>
          </div>
          <span class="pill" id="fcStatus"></span>
        </div>
        <div class="route">
          <div>
            <div class="city" id="fcFromCity"></div>
            <div class="iata" id="fcFrom"></div>
            <div class="time" id="fcDep"></div>
          </div>
          <div class="arrow">→</div>
          <div class="right">
            <div class="city" id="fcToCity"></div>
            <div class="iata" id="fcTo"></div>
            <div class="time" id="fcArr"></div>
          </div>
        </div>
        <div class="meta">
          <div class="row" id="fcGateRow" hidden><span class="k" data-i18n="gate"></span><span class="v" id="fcGate"></span></div>
          <div class="row" id="fcTermRow" hidden><span class="k" data-i18n="terminal"></span><span class="v" id="fcTerm"></span></div>
          <div class="row" id="fcDelayRow" hidden><span class="k" data-i18n="delay"></span><span class="v tone-warn" id="fcDelay"></span></div>
        </div>
        <p class="updated" id="fcUpdated"></p>
        <button type="button" class="share" id="shareBtn" data-i18n="share"></button>
      </article>
    </section>

    <section id="airportView" hidden>
      <form class="search" id="airportForm" autocomplete="off">
        <input id="airportInput" name="airport" maxlength="3" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="search" data-i18n-placeholder="airportPlaceholder"/>
        <button type="submit" data-i18n="search"></button>
      </form>
      <div class="seg" role="group">
        <button type="button" class="chip" data-dir="departure" data-i18n="departures"></button>
        <button type="button" class="chip" data-dir="arrival" data-i18n="arrivals"></button>
      </div>
      <p class="board-title" id="boardTitle" hidden></p>
      <p class="msg" id="boardMsg" hidden></p>
      <ul class="board" id="board"></ul>
    </section>

    <a class="getapp" id="getApp" target="_blank" rel="noopener" data-i18n="getApp"></a>
  </div>
  <p class="toast" id="toast" role="status" hidden></p>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="/liff-core.js"></script>
  <script>
    (function () {
      var core = window.WaiAirLiff;
      var liffIdMeta = document.querySelector('meta[name="waiair-liff-id"]');
      var LIFF_ID = (liffIdMeta && liffIdMeta.getAttribute('content') || '').trim();
      var LANG_KEY = 'waiair.liff.lang';
      var state = { lang: 'th', tab: 'flight', dir: 'departure', airport: '', flight: null, updatedAt: null, rows: [], liffReady: false };
      var airportNames = null;
      var flightSeq = 0;
      var boardSeq = 0;
      var toastTimer = 0;

      function $(id) { return document.getElementById(id); }
      function t(key, params) { return core.format(core.STRINGS[state.lang][key], params); }
      function statusLabel(key) { return core.STRINGS[state.lang].status[key] || core.STRINGS[state.lang].status.scheduled; }
      function setText(id, value) { $(id).textContent = value || ''; }
      function all(selector) { return Array.prototype.slice.call(document.querySelectorAll(selector)); }

      function storedLang() {
        try { return localStorage.getItem(LANG_KEY); } catch (e) { return null; }
      }

      /** Messages keep their key so a language switch re-renders them. */
      function showMsg(id, key, params, isError) {
        var el = $(id);
        el.hidden = !key;
        el.classList.toggle('error', !!isError);
        el.setAttribute('data-key', key || '');
        el.setAttribute('data-params', JSON.stringify(params || {}));
        el.textContent = key ? t(key, params) : '';
      }

      function applyLang(lang, persist) {
        state.lang = core.pickLang(lang);
        if (persist) {
          try { localStorage.setItem(LANG_KEY, state.lang); } catch (e) {}
        }
        document.documentElement.lang = state.lang;
        document.title = 'WaiAir · ' + t('title');
        all('[data-i18n]').forEach(function (el) { el.textContent = t(el.getAttribute('data-i18n')); });
        all('[data-i18n-placeholder]').forEach(function (el) { el.placeholder = t(el.getAttribute('data-i18n-placeholder')); });
        all('[data-lang]').forEach(function (el) { el.setAttribute('aria-pressed', String(el.getAttribute('data-lang') === state.lang)); });
        all('.msg[data-key]').forEach(function (el) {
          var key = el.getAttribute('data-key');
          if (key) el.textContent = t(key, JSON.parse(el.getAttribute('data-params') || '{}'));
        });
        if (state.flight) renderFlight();
        renderBoard();
      }

      function showTab(tab) {
        state.tab = tab;
        $('flightView').hidden = tab !== 'flight';
        $('airportView').hidden = tab !== 'airport';
        all('[data-tab]').forEach(function (el) { el.setAttribute('aria-selected', String(el.getAttribute('data-tab') === tab)); });
      }

      function setUrl(params) {
        try {
          var q = new URLSearchParams(params).toString();
          history.replaceState(null, '', location.pathname + (q ? '?' + q : ''));
        } catch (e) {}
      }

      function toast(text) {
        var el = $('toast');
        el.textContent = text;
        el.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { el.hidden = true; }, 2600);
      }

      function fetchJson(path) {
        return fetch(core.PROXY + path, { cache: 'no-store' }).then(function (res) {
          return res.text().then(function (text) {
            var body = null;
            try { body = text ? JSON.parse(text) : null; } catch (e) {}
            return { ok: res.ok, status: res.status, body: body };
          });
        });
      }

      function localClock(date) {
        return date.toLocaleTimeString(state.lang === 'th' ? 'th-TH' : 'en-GB', { hour: '2-digit', minute: '2-digit' });
      }

      // ── Flight ─────────────────────────────────────────────────────────────
      function loadFlight(input) {
        showTab('flight');
        var number = core.normalizeFlightNumber(input);
        if (!number) {
          showMsg('flightMsg', 'invalidFlight', null, true);
          return;
        }
        $('flightInput').value = number;
        var seq = ++flightSeq;
        $('flightCard').hidden = true;
        showMsg('flightMsg', 'loading');
        fetchJson('/flight/' + encodeURIComponent(number)).then(function (r) {
          if (seq !== flightSeq) return;
          var items = Array.isArray(r.body) ? r.body : (r.body && r.body.departure ? [r.body] : []);
          var summary = r.ok ? core.flightSummary(core.pickFlight(items, Date.now())) : null;
          if (!summary) {
            var err = core.errorInfo(r.ok ? 404 : r.status, r.body);
            showMsg('flightMsg', err.key, err.params, true);
            return;
          }
          state.flight = summary;
          state.updatedAt = new Date();
          showMsg('flightMsg', null);
          renderFlight();
          setUrl({ f: number });
        }).catch(function () {
          if (seq === flightSeq) showMsg('flightMsg', 'unavailable', null, true);
        });
      }

      function renderFlight() {
        var f = state.flight;
        if (!f) return;
        setText('fcAirline', f.airline || t('tabFlight'));
        setText('fcNumber', f.number);
        var pill = $('fcStatus');
        pill.className = 'pill tone-' + core.statusTone(f.status);
        pill.textContent = statusLabel(f.status);
        setText('fcFrom', f.from || '—');
        setText('fcFromCity', f.fromCity);
        setText('fcDep', f.depTime || '—');
        setText('fcTo', f.to || '—');
        setText('fcToCity', f.toCity);
        setText('fcArr', f.arrTime || '—');
        $('fcGateRow').hidden = !f.gate;
        setText('fcGate', f.gate);
        $('fcTermRow').hidden = !f.terminal;
        setText('fcTerm', f.terminal);
        var showDelay = f.delayMin > 0 && f.status !== 'cancelled' && f.status !== 'landed';
        $('fcDelayRow').hidden = !showDelay;
        setText('fcDelay', showDelay ? t('minutes', { n: f.delayMin }) : '');
        setText('fcUpdated', state.updatedAt ? t('updated', { t: localClock(state.updatedAt) }) : '');
        $('flightCard').hidden = false;
      }

      function shareFlight() {
        var f = state.flight;
        if (!f) return;
        var link = core.shareLink(LIFF_ID, f.number);
        if (state.liffReady && liff.isApiAvailable('shareTargetPicker')) {
          if (!liff.isLoggedIn()) {
            liff.login({ redirectUri: location.href });
            return;
          }
          liff.shareTargetPicker([core.flightFlexMessage(f, state.lang, link)], { isMultiple: true })
            .then(function (res) {
              if (res && res.status === 'success') toast(t('shared'));
            })
            .catch(function (e) {
              console.warn('[liff] shareTargetPicker failed', e && e.code, e && e.message);
              openTextShare(f, link);
            });
          return;
        }
        openTextShare(f, link);
      }

      function openTextShare(f, link) {
        var url = core.lineTextShareUrl(f, state.lang, link);
        if (state.liffReady) liff.openWindow({ url: url, external: false });
        else window.location.href = url;
      }

      // ── Airport board ──────────────────────────────────────────────────────
      function loadAirportNames() {
        if (airportNames) return Promise.resolve(airportNames);
        return fetch('/airports.json')
          .then(function (r) { return r.ok ? r.json() : {}; })
          .catch(function () { return {}; })
          .then(function (data) { airportNames = data || {}; return airportNames; });
      }

      function loadBoard(input, dir) {
        showTab('airport');
        if (dir) state.dir = dir;
        renderSeg();
        var iata = core.normalizeIata(input);
        if (!iata) {
          showMsg('boardMsg', 'invalidAirport', null, true);
          return;
        }
        state.airport = iata;
        $('airportInput').value = iata;
        var seq = ++boardSeq;
        state.rows = [];
        renderBoard();
        showMsg('boardMsg', 'loading');
        loadAirportNames().then(function (names) {
          if (seq !== boardSeq) return;
          var ap = names[iata];
          $('boardTitle').hidden = false;
          setText('boardTitle', ap ? ap.name + ' (' + iata + ')' : iata);
        });
        fetchJson('/fids/' + iata + '/' + state.dir).then(function (r) {
          if (seq !== boardSeq) return;
          if (!r.ok) {
            var err = core.errorInfo(r.status, r.body, 'boardEmpty');
            showMsg('boardMsg', err.key, err.params, err.key !== 'boardEmpty');
            return;
          }
          state.rows = core.upcomingRows(core.boardRows(r.body, state.dir), Date.now());
          showMsg('boardMsg', state.rows.length ? null : 'boardEmpty');
          renderBoard();
          setUrl({ a: iata, d: state.dir });
        }).catch(function () {
          if (seq === boardSeq) showMsg('boardMsg', 'unavailable', null, true);
        });
      }

      function renderSeg() {
        all('[data-dir]').forEach(function (el) { el.setAttribute('aria-pressed', String(el.getAttribute('data-dir') === state.dir)); });
      }

      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text) node.textContent = text;
        return node;
      }

      function renderBoard() {
        var list = $('board');
        list.textContent = '';
        state.rows.forEach(function (row) {
          var btn = el('button', 'board-row');
          btn.type = 'button';
          btn.setAttribute('data-flight', row.number);

          var time = el('span', 't', row.time || '—');
          if (row.expected && row.expected !== row.time) time.appendChild(el('small', '', row.expected));
          btn.appendChild(time);

          var mid = el('span', 'mid');
          mid.appendChild(el('span', 'n', row.number));
          mid.appendChild(el('span', 'd', [row.remoteCity || row.remote, row.airline].filter(Boolean).join(' · ')));
          btn.appendChild(mid);

          var status = el('span', 's tone-' + core.statusTone(row.status), statusLabel(row.status));
          if (row.gate) status.appendChild(el('small', '', t('gate') + ' ' + row.gate));
          btn.appendChild(status);

          var li = el('li');
          li.appendChild(btn);
          list.appendChild(li);
        });
      }

      // ── Wiring ─────────────────────────────────────────────────────────────
      function updateGetApp() {
        var os = state.liffReady ? liff.getOS() : (/android/i.test(navigator.userAgent) ? 'android' : 'ios');
        $('getApp').href = core.storeUrl(os);
      }

      $('flightForm').addEventListener('submit', function (e) {
        e.preventDefault();
        $('flightInput').blur();
        loadFlight($('flightInput').value);
      });
      $('airportForm').addEventListener('submit', function (e) {
        e.preventDefault();
        $('airportInput').blur();
        loadBoard($('airportInput').value);
      });
      $('shareBtn').addEventListener('click', shareFlight);
      all('[data-lang]').forEach(function (btn) {
        btn.addEventListener('click', function () { applyLang(btn.getAttribute('data-lang'), true); });
      });
      all('[data-tab]').forEach(function (btn) {
        btn.addEventListener('click', function () { showTab(btn.getAttribute('data-tab')); });
      });
      all('[data-dir]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var dir = btn.getAttribute('data-dir');
          if (state.airport) loadBoard(state.airport, dir);
          else { state.dir = dir; renderSeg(); }
        });
      });
      $('board').addEventListener('click', function (e) {
        var row = e.target.closest ? e.target.closest('[data-flight]') : null;
        if (row) loadFlight(row.getAttribute('data-flight'));
      });

      function initLiff() {
        if (!LIFF_ID || !window.liff) return Promise.resolve();
        return liff.init({ liffId: LIFF_ID }).then(function () {
          state.liffReady = true;
          if (!storedLang() && typeof liff.getAppLanguage === 'function') applyLang(liff.getAppLanguage(), false);
          updateGetApp();
        }).catch(function (e) {
          console.warn('[liff] init failed', e && e.code, e && e.message);
        });
      }

      function route() {
        var q = core.parseQuery(location.search);
        if (q.flight) loadFlight(q.flight);
        else if (q.airport) loadBoard(q.airport, q.dir);
      }

      applyLang(storedLang() || navigator.language || 'th', false);
      showTab('flight');
      renderSeg();
      updateGetApp();
      initLiff().then(route);
    })();
  </script>
</body>
</html>
