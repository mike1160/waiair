name: WaiAir Build & Submit

# iOS builds only for release tags (v1.18.0) or a manual run — pushes to main run test.yml.
# Suffixed tags like v1.18.0-pre-line don't match, so fallback tags never upload a build.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

jobs:
  build-and-submit:
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      # App Store credentials exist for all targets (app, widget, watch, complication);
      # the ad-hoc "local" profile has none for the extension targets and fails non-interactively.
      - name: Build iOS locally (no EAS cloud credits used)
        run: eas build --platform ios --profile production --local --non-interactive --output ./waiair.ipa

      - name: Upload .ipa as artifact
        uses: actions/upload-artifact@v4
        with:
          name: waiair-ios-build
          path: "*.ipa"
          retention-days: 7

      - name: Submit to App Store (only on release tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: eas submit --platform ios --profile production --non-interactive --path ./waiair.ipa
